<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
     style="z-index: 2000;">

  <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 animate-scale-up text-center">

    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-amber-50 border border-amber-100 text-amber-500 mb-4">
      <span class="text-xl">⚠️</span>
    </div>

    <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">
      {{ titulo }}
    </h3>

    <p class="text-xs text-slate-400 mt-2 leading-relaxed">
      {{ mensagem }}
    </p>

    <div class="grid grid-cols-2 gap-3 mt-6">

      <button (click)="onCancelar.emit()"
              type="button"
              class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-95 cursor-pointer select-none">
        {{ cancelarTexto }}
      </button>

      <button (click)="onConfirmar.emit()"
              type="button"
              class="bg-amber-500 hover:bg-amber-600 text-white font-black py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md active:scale-95 cursor-pointer select-none">
        {{ confirmarTexto }}
      </button>

    </div>

  </div>

</div>
