server:
  port: 8083

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: cidadaos-service

  # Base de dados de interações dos munícipes
  datasource:
    url: jdbc:postgresql://localhost:5435/db_cidadaos
    username: user_cidadaos
    password: pwd_cidadaos

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração base do Kafka preparada para futuros alertas de feiras
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cidadaos-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"