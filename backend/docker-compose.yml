version: '3.8'

services:
  postgres-camaras:
    image: postgres:16-alpine
    container_name: db_camaras
    environment:
      POSTGRES_USER: user_camaras
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: camaras_db
    ports:
      - "5432:5432"

  postgres-feirantes:
    image: postgres:16-alpine
    container_name: db_feirantes
    environment:
      POSTGRES_USER: user_feirantes
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: feirantes_db
    ports:
      - "5433:5432"

  postgres-cidadaos:
    image: postgres:16-alpine
    container_name: db_cidadaos
    environment:
      POSTGRES_USER: user_cidadaos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cidadaos_db
    ports:
      - "5434:5432"